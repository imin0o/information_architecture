name: checks

# This workflow checks committed metadata and self-written fixtures only.
# It cannot prevent the initial upload; use local pre-commit/pre-push first.
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.7"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      # Includes the distribution check: regenerate into a temp dir, verify references, hashes,
      # mixing and leaks, and compare with verification/distributions.yaml. Source re-check is not_run.
      - run: uv run --locked iakit check --local
