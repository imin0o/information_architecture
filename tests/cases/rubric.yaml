# 内容評価ルーブリック（requirements.md 10章、AC-09）。
# 成果物を作ったエージェントとは別の確認者（人または指定した確認エージェント）が、固定ケースごとに同じ条件で判定する。
# 作ったLLMの自己評価やスキーマ検証の結果を合格の根拠にしない。判定は runs/<run_id>/rubric-judgment.yaml に記録する。
# 基準を変える場合は rubric_version を上げて理由を記録し、影響するケースを再評価する。
schema_version: "1.0"
rubric_version: 1.2.0
pass_rule: >-
  ケースの required_conditions、適用するルーブリック項目の pass_criteria のうちケースの成果物に該当するもの、
  およびその項目の case_criteria をすべて満たし、未解決の critical の指摘がないこと。
  pass_criteria は全ケース共通の基準、case_criteria はケース固有の具体条件とする。
  major・minor の残件は理由と影響を記録する。単一の正解階層との一致や、判断の一致率を合格条件にしない。
input_gaps: >-
  固定ケースの入力にない情報や、入力どうしの解消できない矛盾は、成果物の不備ではない。成果物が仮定または未解決として明示し、
  検証計画で確かめる方法と確認先を示している場合は、issues に重大度を付けて書かず input_gaps に記録する。
  明示や検証計画が欠けている場合、入力にある情報を使っていない場合、入力にない内容を確定事項として書いている場合は、
  該当する項目（R-07など）の issues として重大度を付ける。
changes:
- version: 1.2.0
  reason: >-
    M6の代表ケースで、入力にない料金の地区差や、入力どうしの矛盾で決まらない位置付けを、成果物が未解決として明示し
    検証計画に載せていても、判定者によって major とする場合としない場合があった。入力の不足は成果物の不備と区別して
    input_gaps に記録し、成果物の不備だけに重大度を付けるようにした。合格規則は変えていない
- version: 1.1.0
  reason: >-
    第三者レビュー（Codex）を反映。共通基準とケース固有基準の関係を合格規則に明記した。
    R-02の循環禁止を上位・下位関係に限定し、R-03の粒度の条件を同じ役割の兄弟項目・同じファセット内に絞った。
    R-04の配置先の条件をStructureを含む経路に限定し、R-07の仮定の明示を仮定を置いた場合の条件にした
severity:
  critical: 主要タスクを完了できない、対象コンテンツが失われる、または not_supported の主張や未実測の内容を確定事項として扱っている
  major: 主要タスクは完了できるが、遠回り・誤解・判断根拠の欠落が残る
  minor: 表記・粒度の揺れなど、タスクの完了や根拠の追跡を妨げない問題
items:
- item: R-01
  name: 目的・利用者との適合
  pass_criteria:
  - 問題定義に、設計対象・利用者・目的・利用環境が書かれ、それぞれ入力の位置か仮定に対応している
  - 構造や分類の採用理由が、記載した利用者と目的のどれに対応するかを説明している
  fail_examples:
  - 入力にない利用者像を事実として書き、仮定として明示していない
  - 運営組織の部署構成をそのまま最上位の構造にし、利用者の目的との関係を説明していない
- item: R-02
  name: 概念の区別と関係
  pass_criteria:
  - 同名異義語を別の概念IDに分け、区別を scope_note で説明している
  - 同義語・表記揺れを1つの概念IDの alt_labels にまとめ、上位・下位関係が循環していない（関連関係の相互参照は許容する）
  fail_examples:
  - 意味の異なる語をラベルが同じという理由で1つの概念にまとめている
  - 同義語を別概念のまま並べ、利用者がどちらを選べばよいか判別できない
- item: R-03
  name: 命名と粒度
  pass_criteria:
  - 同じ役割の兄弟項目、または同じファセット内の項目が、同じ観点・粒度で付けられ、利用者の語で書かれている
  - 専門用語を使う場合は初出で説明か英語を併記している
  fail_examples:
  - 同じ親の下に「家事代行」と「北地区」のように、別のファセットの項目が混在している
  - 社内略語や部署名だけのラベルがある
- item: R-04
  name: コンテンツの分類・配置
  pass_criteria:
  - コンテンツ一覧の全項目が、配置済み・未処理・対象外のいずれかに区分され、未処理と対象外に理由がある
  - 分類済みの項目が、対応する概念IDから追跡できる
  - 経路にStructureを含む場合、配置済みの項目が配置先のノードからも追跡できる
  fail_examples:
  - 一部のコンテンツが分類にも配置にも現れず、理由も記録されていない
  - 対象外とした項目が配置先に残っている
- item: R-05
  name: 主要タスクの探索経路
  pass_criteria:
  - 各主要タスクについて、ルートから到達先までの経路がノードIDで示され、ケースの到達先条件を満たす
  - 複数の属性で絞り込むタスクでは、どの属性から入っても到達できる
  fail_examples:
  - 主要タスクの到達先がどのノードにもない
  - 1つの属性の階層だけで構成し、別の属性から探す利用者が全件を見なければならない
- item: R-06
  name: 根拠と適用条件
  pass_criteria:
  - 方法の採否に文献根拠・入力の観察・仮定を区別して記録し、文献の適用条件と案件の条件の対応を説明している
  - 未照合・未レビューの文献主張を仮説として扱い、not_supported の主張を採用理由に使っていない
  fail_examples:
  - 文献の主張を、適用条件を確かめずに案件へ一般化している
  - 矛盾する根拠の一方だけを示し、もう一方を記録していない
- item: R-07
  name: 未検証事項の明示
  pass_criteria:
  - 仮定を置いた場合は成果物の冒頭に仮定に基づく箇所を示す
  - 実ユーザー調査をしていない判断（not_tested・planned・simulated）を検証済みとして書いていない
  - 検証計画に、未検証の判断と確かめる方法を対応付けている
  fail_examples:
  - LLMの模擬評価や専門家の点検を、利用者による検証結果として書いている
  - 反証や結果の混在した調査を、支持された結果として報告している
